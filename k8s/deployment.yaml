apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lifecycle-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: joel-flask-app
          image: 203918843788.dkr.ecr.us-east-1.amazonaws.com/devops-lifecycle-app:v1
          ports:
            - containerPort: 5001
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
