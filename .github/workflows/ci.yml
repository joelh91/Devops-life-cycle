name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::203918843788:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Login to amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: docker build
        run: docker build -t 203918843788.dkr.ecr.us-east-1.amazonaws.com/devops-lifecycle-app:${{ github.sha }} .

      - name: push Docker image
        run: docker push 203918843788.dkr.ecr.us-east-1.amazonaws.com/devops-lifecycle-app:${{ github.sha }}

      
